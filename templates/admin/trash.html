{% extends "base.html" %}
{% block title %}ถังขยะ — Admin{% endblock %}
{% block content %}
<div class="fade-up">
    <h1 class="font-display text-3xl font-extrabold">ถังขยะ</h1>
    <p class="mt-1 text-white/50">กู้คืนบัญชี หรือลบถาวร</p>

    <div class="mt-6 overflow-x-auto rounded-2xl border border-white/10">
        <table class="min-w-full text-sm">
            <thead class="bg-sweden-navy/70 text-left text-sweden-gold">
                <tr>
                    <th class="px-4 py-3">Username</th>
                    <th class="px-4 py-3">อีเมล</th>
                    <th class="px-4 py-3">ลบเมื่อ</th>
                    <th class="px-4 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-white/5 bg-night-100/80">
                {% for u in deleted_users %}
                <tr>
                    <td class="px-4 py-3 font-semibold">{{ u.username }}</td>
                    <td class="px-4 py-3">{{ u.email }}</td>
                    <td class="px-4 py-3">{{ u.deleted_at }}</td>
                    <td class="px-4 py-3">
                        <div class="flex justify-end gap-2">
                            <form action="/admin/restore-user" method="POST">
                                <input type="hidden" name="username" value="{{ u.username }}">
                                <button class="rounded-lg bg-sweden-blue px-3 py-1.5 text-xs font-semibold text-white">กู้คืน</button>
                            </form>
                            <form action="/admin/delete-user-permanent" method="POST" onsubmit="return confirm('ลบถาวร ไม่สามารถกู้คืนได้')">
                                <input type="hidden" name="username" value="{{ u.username }}">
                                <button class="rounded-lg border border-red-400/30 bg-red-500/10 px-3 py-1.5 text-xs font-semibold text-red-300">ลบถาวร</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="px-4 py-8 text-center text-white/40">ถังขยะว่าง</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
