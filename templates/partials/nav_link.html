{% set active = current_page == item[0] or (item[0] == 'admin_users' and current_page == 'admin_trash') %}
<a href="{{ item[1] }}" class="nav-link{% if active %} is-active{% endif %}" title="{{ item[2] }}">
    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="{{ item[3] }}"/>
    </svg>
    <span class="nav-label">{{ item[2] }}</span>
</a>
